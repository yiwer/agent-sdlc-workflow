name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit + safety + package + content-contract tests
        run: python -m unittest discover -s tests -v

      - name: Verify committed .skill matches source (drift gate)
        run: python scripts/package_skill.py --check
